<!DOCTYPE html>
<html>
<head>

    <style>
        #intro {
            background-color: #f0f8ff;

            border: 2px solid #4CAF50; 
            padding: 20px;
            margin: 20px;
            font-family: Arial, sans-serif;
            border-radius: 8px;

</head>

    <div id="intro">

    </div>

</body>
</html>
