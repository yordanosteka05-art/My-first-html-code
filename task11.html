<!DOCTYPE html>
<html>
<head>
    <title>Div Blocks with Classes</title>
    <style>
        .box1 {
            background-color: #4CAF50; /* Green */
            color: white;
            padding: 20px;
            margin: 10px;
            text-align: center;
            border-radius: 8px;
        }

        .box2 {
            background-color: #2196F3; /* Blue */
            color: white;
            padding: 20px;
            margin: 10px;
            text-align: center;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>Styled Div Blocks</h2>

    <div class="box1">
        <h3>First Div Block</h3>
        <p>This is the first div, styled with the class <b>box1</b>.</p>
    </div>

    <div class="box2">
        <h3>Second Div Block</h3>
        <p>This is the second div, styled with the class <b>box2</b>.</p>
    </div>

</body>
</html>
