<!DOCTYPE html>
<html>
<head>
    <title>Iframe Example</title>
    <style>
        iframe {
            width: 100%;
            height: 500px;
            border: 2px solid #4CAF50;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>Embedding W3Schools Homepage</h2>

    <iframe src="https://www.w3schools.com" title="W3Schools Homepage"></iframe>

</body>
</html>
