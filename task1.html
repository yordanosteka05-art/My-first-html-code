<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Internal CSS </title>
    <style>
       
        body {
            background-color: lightblue;
        }

        h1 {
            text-align: center; 
            color: darkblue;
        }

        p {
            color: darkred; 
            font-size: 18px; 
            text-align: justify;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Web Page</h1>
    <p>
        This is an example of using internal CSS to style an HTML document.
        The background color, heading alignment, and paragraph font style are all controlled through the CSS inside the &lt;style&gt; tag.
    </p>

</body>
</html>
