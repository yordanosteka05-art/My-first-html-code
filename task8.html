<!DOCTYPE html>
<html>
<head>
    <title>HTML Table with CSS</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse; 
            margin: 20px 0;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #333; 
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #4CAF50; 
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2; 
        }
    </style>
</head>
<body>

    <h2>Student Information</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>Hana peng</td>
            <td>21</td>
            <td>Hana.peg@example.com</td>
        </tr>
        <tr>
            <td>Nati natisha</td>
            <td>25</td>
            <td>nati.natisha@example.com</td>
        </tr>
        <tr>
            <td>Michael Brown</td>
            <td>19</td>
            <td>michael.brown@example.com</td>
        </tr>
    </table>

</body>
</html>
