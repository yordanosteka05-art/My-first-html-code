<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists </title>
</head>
<body>

    <h2>My Favorite Programming Languages</h2>

    <h3>Ordered List</h3>
    <ol>
        <li>Python</li>
        <li>JavaScript</li>
        <li>Java</li>
        <li>C++</li>
        <li>Go</li>
    </ol>

    <h3>Unordered List</h3>
    <ul>
        <li>Python</li>
        <li>JavaScript</li>
        <li>Java</li>
        <li>C++</li>
        <li>Go</li>
    </ul>

</body>
</html>
